[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-doctor-appointment-agent"
version = "0.1.0"
description = "Production-oriented AI Doctor Appointment Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "openai>=1.10.0,<2.0.0",
    "voyageai>=0.3.5,<1.0.0",
    "langsmith>=0.1.0",
    "langgraph>=0.0.30",
    "supabase>=2.3.0",
    "PyJWT>=2.8.0",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
